name: Ping Search Engines

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    name: Submit URLs via IndexNow (Bing/Yandex/Seznam)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit IndexNow (all URLs from sitemap)
        run: |
          echo "Submitting IndexNow with all sitemap URLs..."
          python3 -c "import json; urls=[l.strip()[5:-6] for l in open('sitemap.xml',encoding='utf-8') if l.strip().startswith('<loc>')]; print(json.dumps({'host':'taigetag.com','key':'IMPLQzV8ZJL3XT7alCYPLLhxLidYNlkc','keyLocation':'https://taigetag.com/IMPLQzV8ZJL3XT7alCYPLLhxLidYNlkc.txt','urlList':urls}))" > /tmp/indexnow.json
          cat /tmp/indexnow.json
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/indexnow.json \
            -o /dev/null -w "IndexNow HTTP %{http_code}\n"
          echo "IndexNow submission done (all pages)"

      - name: Fetch live URLs (warm CDN cache)
        run: |
          curl -s -o /dev/null -w "taigetag.com HTTP %{http_code}\n" "https://taigetag.com/"
          curl -s -o /dev/null -w "sitemap HTTP %{http_code}\n" "https://taigetag.com/sitemap.xml"
          curl -s -o /dev/null -w "indexnow-key HTTP %{http_code}\n" "https://taigetag.com/IMPLQzV8ZJL3XT7alCYPLLhxLidYNlkc.txt"
